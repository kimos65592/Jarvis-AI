name: Build JARVIS APK
on:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Install dependencies
        run: flutter pub get
        working-directory: ./PlayStoreApp

      - name: Build APK
        run: flutter build apk --release
        working-directory: ./PlayStoreApp

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-app
          path: PlayStoreApp/build/app/outputs/flutter-apk/app-release.apk
