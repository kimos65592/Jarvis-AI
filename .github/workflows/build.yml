name: Build JARVIS APK
on:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Fresh Flutter Project
        run: |
          flutter create jarvis_clean_app
          cd jarvis_clean_app
          flutter pub add google_generative_ai speech_to_text flutter_tts url_launcher android_intent_plus intl audioplayers

      - name: Inject JARVIS Code
        run: |
          cp PlayStoreApp/app-contents/jarvis.dart jarvis_clean_app/lib/main.dart

      - name: Force Fix Android Compatibility (SDK 23)
        run: |
          sed -i 's/minSdkVersion .*/minSdkVersion 23/' jarvis_clean_app/android/app/build.gradle

      - name: Build APK
        run: flutter build apk --release
        working-directory: ./jarvis_clean_app

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-app
          path: jarvis_clean_app/build/app/outputs/flutter-apk/app-release.apk
